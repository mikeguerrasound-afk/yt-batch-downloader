name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: >
          pyinstaller --onefile --windowed --name BatchVideoDownloader
          --collect-all yt_dlp --collect-all imageio_ffmpeg app.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/BatchVideoDownloader.exe -DestinationPath BatchVideoDownloader-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: BatchVideoDownloader-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: >
          pyinstaller --windowed --name BatchVideoDownloader
          --collect-all yt_dlp --collect-all imageio_ffmpeg app.py
      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/BatchVideoDownloader.app BatchVideoDownloader-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: BatchVideoDownloader-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            BatchVideoDownloader-windows.zip
            BatchVideoDownloader-macos.zip
          generate_release_notes: true
